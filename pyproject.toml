[project]
name = "phononsml"
version = "0.1.0"
description = "Phonon calculations with ML potentials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.29.0",
    "jarvis-tools>=2026.6.12",
    "marimo>=0.23.15",
    "polars>=1.43.1",
    "pymatgen>=2026.5.4",
    "phonopy>=4.4.0",
    "matplotlib>=3.10.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phonons_ml"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "pre-commit>=4.6.1",
]

mace = [
    "mace-torch>=0.3.16",
    "torch>=2.0.0",
    "e3nn>=0.4.4,<0.5.0",
    "phononsml[dev]",
]

mattersim = [
    "mattersim>=1.1.0",
    "torch>=2.2.0,<2.5.0",
    "e3nn>=0.5.0",
    "phononsml[dev]",
]

upet = [
    "upet>=0.2.6",
    "phononsml[dev]",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/.git",
    "/.venv",
    "/__pycache__",
    "/tests",
    "/docs",
    "*.pyc",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP",
    "PLC", # Pylint Convention
    "PLR", # Pylint Refactor
]

ignore = [
    "E501",    # line too long
    "B008",    # do not perform function calls in argument defaults
    "B904",    # raise from None
    "S101",    # Use of assert
    "T201",    # print
    "RUF012",  # mutable class attributes
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "ANN001",  # Missing type annotation for function argument
    "C901",    # function is too complex
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR0917", # too many positional arguments
    "SIM105",  # use contextlib.suppress
    "ANN401",  # dynamically typed expressions (Any)
    "PLC0415", # import should be at the top-level of a file (важно для ленивых импортов)
]

fixable = ["ALL"]
unfixable = []


[tool.ruff.lint.isort]
known-first-party = ["phonons_ml"]
known-third-party = []
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "ANN"]
"*/__init__.py" = ["F401", "F403"]
"docs/*" = ["ALL"]
"src/track/__main__.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ============ MYPY CONFIGURATION ============
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "docs/"]
plugins = []

# ============ PYTEST CONFIGURATION ============
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# ============ COVERAGE CONFIGURATION ============
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 70
